<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポモドーロタイマー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="focus-background" aria-hidden="true">
    <div class="particle-layer">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>
    <div class="ripple-layer">
      <span class="ripple"></span>
      <span class="ripple"></span>
      <span class="ripple"></span>
    </div>
  </div>
  <div class="window-wrapper">
    <!-- タイトルバー -->
    <div class="title-bar">
      <span class="title-text">ポモドーロタイマー</span>
      <div class="window-controls">
        <span class="win-btn">&#8722;</span>
        <span class="win-btn">&#9633;</span>
        <span class="win-btn">&#10005;</span>
      </div>
    </div>

    <!-- メインカード -->
    <div class="card">
      <!-- フェーズラベル -->
      <p id="phase-label" class="phase-label">作業中</p>

      <!-- 円形プログレスバー -->
      <div class="timer-ring-wrapper">
        <svg class="timer-ring" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop id="ring-gradient-start" offset="0%" stop-color="#2f80ed"></stop>
              <stop id="ring-gradient-end" offset="100%" stop-color="#56ccf2"></stop>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52" />
        </svg>
        <span id="timer-display" class="timer-display">25:00</span>
      </div>

      <!-- ボタン -->
      <div class="btn-group">
        <button id="start-btn" class="btn btn-primary" onclick="toggleTimer()">開始</button>
        <button class="btn btn-outline" onclick="resetTimer()">リセット</button>
      </div>

      <!-- 今日の進捗パネル -->
      <div class="progress-panel">
        <p class="panel-title">今日の進捗</p>
        <div class="panel-stats">
          <div class="stat">
            <span id="completed-count" class="stat-value">0</span>
            <span class="stat-label">完了</span>
          </div>
          <div class="stat accent">
            <span id="total-time" class="stat-value">0分</span>
            <span class="stat-label">集中時間</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
