<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポモドーロタイマー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="window-wrapper">
    <!-- タイトルバー -->
    <div class="title-bar">
      <span class="title-text">ポモドーロタイマー</span>
      <div class="window-controls">
        <span class="win-btn">&#8722;</span>
        <span class="win-btn">&#9633;</span>
        <span class="win-btn">&#10005;</span>
      </div>
    </div>

    <!-- メインカード -->
    <div class="card">
      <!-- フェーズラベル -->
      <p id="phase-label" class="phase-label">作業中</p>

      <!-- 円形プログレスバー -->
      <div class="timer-ring-wrapper">
        <svg class="timer-ring" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52" />
        </svg>
        <span id="timer-display" class="timer-display">25:00</span>
      </div>

      <!-- ボタン -->
      <div class="btn-group">
        <button id="start-btn" class="btn btn-primary" onclick="toggleTimer()">開始</button>
        <button class="btn btn-outline" onclick="resetTimer()">リセット</button>
      </div>

      <div class="settings-panel">
        <div class="setting-row">
          <label for="work-duration">作業時間</label>
          <select id="work-duration">
            <option value="15">15分</option>
            <option value="25" selected>25分</option>
            <option value="35">35分</option>
            <option value="45">45分</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="break-duration">休憩時間</label>
          <select id="break-duration">
            <option value="5" selected>5分</option>
            <option value="10">10分</option>
            <option value="15">15分</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="theme-select">テーマ</label>
          <select id="theme-select">
            <option value="light" selected>ライト</option>
            <option value="dark">ダーク</option>
            <option value="focus">フォーカス</option>
          </select>
        </div>
        <div class="setting-row sound-row">
          <span>サウンド</span>
          <div class="sound-options">
            <label><input id="sound-start" type="checkbox" checked />開始</label>
            <label><input id="sound-end" type="checkbox" checked />終了</label>
            <label><input id="sound-tick" type="checkbox" />tick</label>
          </div>
        </div>
      </div>

      <!-- 今日の進捗パネル -->
      <div class="progress-panel">
        <p class="panel-title">今日の進捗</p>
        <div class="panel-stats">
          <div class="stat">
            <span id="completed-count" class="stat-value">0</span>
            <span class="stat-label">完了</span>
          </div>
          <div class="stat accent">
            <span id="total-time" class="stat-value">0分</span>
            <span class="stat-label">集中時間</span>
          </div>
        </div>
      </div>

      <div class="progress-panel gamification-panel">
        <p class="panel-title">ゲーミフィケーション</p>
        <p class="xp-line">
          Lv.<span id="xp-level">1</span> / 合計XP <span id="xp-total">0</span>
        </p>
        <div class="xp-bar">
          <div id="xp-progress-bar" class="xp-bar-fill"></div>
        </div>
        <p id="xp-progress-label" class="subtle-text">次のレベルまで 500XP</p>
        <p class="streak-line">🔥 <span id="streak-days">0</span>日連続</p>
        <div id="badges-list" class="badge-list"></div>
      </div>

      <div class="progress-panel stats-panel">
        <p class="panel-title">週間統計</p>
        <p class="subtle-text">
          完了率: <span id="weekly-completion-rate">0</span>% /
          平均集中時間: <span id="weekly-avg-focus">0</span>分
        </p>
        <div id="weekly-graph" class="mini-graph"></div>
      </div>

      <div class="progress-panel stats-panel">
        <p class="panel-title">月間統計</p>
        <p class="subtle-text">
          完了率: <span id="monthly-completion-rate">0</span>% /
          平均集中時間: <span id="monthly-avg-focus">0</span>分
        </p>
        <div id="monthly-graph" class="mini-graph monthly-graph"></div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
